  test-pkg-archive:
    runs-on: ${{ matrix.os }}
    name: Test pkg release archives on ${{ matrix.os }} x64
    needs: [build]
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            archive_name_prefix: kikoeru-linux-x64

          - os: macos-latest
            archive_name_prefix: kikoeru-darwin-x64
          
          - os: windows-latest
            archive_name_prefix: kikoeru-win-x64

    steps:
      - name: Get branch or tag name
        id: source_name
        run: echo "SOURCE_NAME=${GITHUB_REF##*/}" >> "$GITHUB_OUTPUT"

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.archive_name_prefix }}-${{ steps.source_name.outputs.SOURCE_NAME }}

      - name: List files
        run: ls -al .

      - name: Test pkg binary on *nix
        if: runner.os != 'Windows'
        run: |
          set -e
          chmod +x ./kikoeru-express
          file ./kikoeru-express || true

          ./kikoeru-express > server.log 2>&1 &
          SERVER_PID=$!
          echo "Server started with PID $SERVER_PID"

          READY=0
          for i in {1..30}; do
            if curl -s -I http://localhost:8888/ >/dev/null 2>&1; then
              echo "Server responded successfully after ${i}s!"
              READY=1
              break
            fi
            if ! kill -0 $SERVER_PID 2>/dev/null; then
              echo "Server process exited prematurely at ${i}s!"
              break
            fi
            sleep 1
          done

          echo "=== Server Log Output ==="
          cat server.log || true
          echo "========================="

          if [ $READY -eq 0 ]; then
            echo "Server failed to respond within 30 seconds"
            exit 1
          fi

          curl --fail -I http://localhost:8888/
          kill -TERM $SERVER_PID || true
      
      - name: Test pkg binary on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $PSVersionTable
          $job = Start-Job { ./kikoeru-express.exe }
          Start-Sleep -Seconds 10
          Receive-Job $job
          curl.exe --fail -I http://localhost:8888/
          Stop-Job $job -ErrorAction SilentlyContinue
          Remove-Job $job -ErrorAction SilentlyContinue

  publish:
    runs-on: ubuntu-latest
    name: Prepare release draft
    if: startsWith(github.ref, 'refs/tags/')
    needs: [test-pkg-archive]

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Packup artifacts
        run: cd artifacts && for i in */; do zip -r "${i%/}.zip" "$i"; done

      - name: List artifacts
        run: ls -al artifacts/

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files:
            artifacts/kikoeru-*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Build artifacts

on:
  push:
    branches-ignore:
      - "dependabot/**"
    tags:
      - v*
  issues:
    types: opened, edited, closed

jobs:
  build-front-end:
    runs-on: ubuntu-latest
    name: Build front end PWA from source
    steps:
      - name: Check out latest front end
        uses: actions/checkout@v4
        with:
          repository: kikoeru-project/kikoeru-quasar
          ref: unstable

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 14

      - name: Fix expired Taobao registry in lockfile
        run: |
          sed -i 's|registry\.npm\.taobao\.org|registry.npmmirror.com|g' package-lock.json
          npm config set registry https://registry.npmmirror.com
          npm config set strict-ssl false

      - run: npm install -g @quasar/cli@1
      - run: npm ci || npm install
      - run: npx quasar build && npx quasar build -m pwa

      - name: 'Upload PWA'
        uses: actions/upload-artifact@v4
        with:
          name: PWA-unstable
          path: dist/pwa
          if-no-files-found: error

      - name: 'Upload SPA'
        uses: actions/upload-artifact@v4
        with:
          name: SPA-unstable
          path: dist/spa
          if-no-files-found: error

  build:
    needs: build-front-end
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node_version: '24'
            architecture: x64
            pkg_target: node24-linux-x64
            archive_name_prefix: kikoeru-linux-x64

          - os: macos-latest
            node_version: '24'
            architecture: x64
            pkg_target: node24-macos-x64
            archive_name_prefix: kikoeru-darwin-x64

          - os: windows-latest
            node_version: '24'
            architecture: x64
            pkg_target: node24-win-x64
            archive_name_prefix: kikoeru-win-x64

    name: Node ${{ matrix.node_version }} - ${{ matrix.architecture }} on ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          check-latest: true
          architecture: ${{ matrix.architecture }}

      - run: npm config set registry https://registry.npmmirror.com
      - run: npm install

      - run: npm test

      - name: Locate and prepare node-sqlite3 bindings
        run: |
          mkdir -p node_modules/sqlite3/lib/binding node_modules/sqlite3/build/Release node_modules/sqlite3/build
          find node_modules/sqlite3 -name "*.node" -exec cp -f {} node_modules/sqlite3/lib/binding/ \; 2>/dev/null || true
          find node_modules/sqlite3 -name "*.node" -exec cp -f {} node_modules/sqlite3/build/Release/ \; 2>/dev/null || true
          find node_modules/sqlite3 -name "*.node" -exec cp -f {} node_modules/sqlite3/build/ \; 2>/dev/null || true
          ls -la node_modules/sqlite3/lib/binding/
          ls -la node_modules/sqlite3/build/

      - name: 'Upload bindings'
        uses: actions/upload-artifact@v4
        with:
          name: node-${{ matrix.node_version }}-${{ matrix.architecture }}-${{ matrix.os }}-binding
          path: node_modules/sqlite3/lib/binding
          if-no-files-found: error

      # refs/tags/v1.2.3 => v1.2.3
      # refs/heads/unstable => unstable
      # refs/heads/feature/foo => foo
      # refs/pull/421/merge => merge
      - name: Get branch or tag name
        id: source_name
        run: echo "SOURCE_NAME=${GITHUB_REF##*/}" >> "$GITHUB_OUTPUT"

      - name: Install pkg
        run: npm install -g @yao-pkg/pkg

      - name: Make empty dirs to suppress pkg warnings
        run: mkdir -p config sqlite covers VoiceWork

      - name: Download front-end artifact (PWA)
        uses: actions/download-artifact@v4
        with:
          name: PWA-unstable
          path: dist

      - name: Check front-end artifacts
        run: ls -al dist/

      - name: Package to executables
        run: pkg package.json -t ${pkg_target} --out-path package
        env:
          pkg_target: ${{ matrix.pkg_target }}

      - name: Create archive
        run: |
          mkdir ${archive_name}
          cp package/* ${archive_name}/
          cp node_modules/sqlite3/lib/binding/*.node ${archive_name}/
        env:
          archive_name: ${{ matrix.archive_name_prefix }}-${{ steps.source_name.outputs.SOURCE_NAME }}

      - name: 'Prepare release archive'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive_name_prefix }}-${{ steps.source_name.outputs.SOURCE_NAME }}
          path: ${{ matrix.archive_name_prefix }}-${{ steps.source_name.outputs.SOURCE_NAME }}
          if-no-files-found: error

